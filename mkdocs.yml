site_name: API de SOMA
site_description: Documentación pública de la API de SOMA Engine
site_url: https://somaengine.github.io/soma-api-docs/
repo_url: https://github.com/SomaEngine/soma-api-docs
repo_name: SomaEngine/soma-api-docs
edit_uri: ""
copyright: SOMA Engine · Los datos de los ejemplos son ficticios

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - assets/soma.css

nav:
  - Integraciones: index.md
  - Guía técnica v1: guia/v1.md
  - Errores: errores.md
  - Referencia OpenAPI: referencia.md
  - Cambios: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
